[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iphone-valuator"
version = "0.1.0"
description = "End-to-end ML pipeline that decides whether an Avito iPhone listing is worth its asking price."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "catboost>=1.2.5,<2",
    "joblib>=1.3",
    "lightgbm>=4.3,<5",
    "lxml>=5.0",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "playwright>=1.45,<2",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
iphone-scrape = "iphone_valuator.scraper:main"
iphone-clean = "iphone_valuator.cleaner:main"
iphone-train = "iphone_valuator.train:main"
iphone-evaluate = "iphone_valuator.evaluator:main"
iphone-synthetic = "iphone_valuator.synthetic:main"

[tool.setuptools.packages.find]
include = ["iphone_valuator*"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF", "C4", "PIE", "PT", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::FutureWarning"]
